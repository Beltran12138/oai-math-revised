<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}oai-math-revised: community notes on the OpenAI math manuscripts{% endblock %}</title>
<meta name="description" content="Community corrections, references, comments and reading groups for the OpenAI math manuscripts.">
<link rel="stylesheet" href="{{ root }}/assets/style.css">
<link rel="stylesheet" href="{{ root }}/assets/katex/katex.min.css">
<script defer src="{{ root }}/assets/katex/katex.min.js"></script>
<script defer src="{{ root }}/assets/katex/contrib/auto-render.min.js"></script>
<script defer src="{{ root }}/assets/site.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="{{ root }}/">oai-math-revised</a>
  <nav>
    <a href="{{ root }}/">Browse</a>
    <a href="{{ root }}/contribute/">Contribute</a>
    <a href="{{ GITHUB }}">GitHub</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer>
  <p>Manuscripts, family summaries and abstracts: OpenAI, <a href="{{ UPSTREAM }}">openai/math</a> (Apache 2.0). Notes and revisions: contributors to <a href="{{ GITHUB }}">mathcommunity/oai-math-revised</a>.</p>
  <p>Index built {{ BUILD_DATE }}. Problem with this site? <a href="{{ SITE_ISSUE }}">Open an issue</a>.</p>
</footer>
</body>
</html>
